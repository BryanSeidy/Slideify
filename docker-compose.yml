version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: slideify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: slideify
      POSTGRES_USER: slideify
      POSTGRES_PASSWORD: slideify_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: slideify-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: