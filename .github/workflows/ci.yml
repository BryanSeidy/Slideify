name: CI

on:
  push:
    branches: [main, develop, 'fix/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://test:test@127.0.0.1:5432/slideify_test
  AUTH_SECRET: ci-test-secret-0123456789abcdef0123456789
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: '6379'
  AI_PROVIDER: mock
  SLIDEIFY_CREDITS_FREE: '3'
  API_PREFIX: /api
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  integration:
    name: unit + real PostgreSQL/Redis tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: slideify_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d slideify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Apply all migrations to real PostgreSQL
        run: pnpm --filter @slideify/schema db:migrate:deploy
      - name: Unit tests (no DB required)
        run: pnpm test
      - name: Integration tests (real PostgreSQL 16 + Redis 7)
        run: pnpm test:integration
